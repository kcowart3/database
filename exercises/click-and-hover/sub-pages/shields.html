<script>
(function () {
    var SHIELD_ACTIVE_KEY = 'sovereignShieldsActive';
    var parts = Array.prototype.slice.call(document.querySelectorAll('#shieldSvg .shield-part'));
    var activatedText = document.getElementById('shieldActivatedText');
    var deactivating = false;
    function setActiveState(active) {
        localStorage.setItem(SHIELD_ACTIVE_KEY, active ? '1' : '0');
        activatedText.hidden = !active;
        activatedText.classList.toggle('is-visible', active);
    }
    function deactivateAll() {
        if (deactivating) return;
        deactivating = true;
        activatedText.classList.remove('is-visible');
        parts.forEach(function (part) { part.classList.add('is-deactivating'); });
        setTimeout(function () {
            parts.forEach(function (part) {
                part.classList.remove('is-activated');
                part.classList.remove('is-deactivating');
            });
            setActiveState(false);
            deactivating = false;
        }, 700);
    }
    function updateActivatedState() {
        var done = parts.every(function (part) { return part.classList.contains('is-activated'); });
        setActiveState(done);
    }
    if (localStorage.getItem(SHIELD_ACTIVE_KEY) === '1') {
        parts.forEach(function (part) { part.classList.add('is-activated'); });
        setActiveState(true);
    }
    parts.forEach(function (part) {
        part.addEventListener('click', function () {
            if (deactivating) return;
            part.classList.add('is-activated');
            updateActivatedState();
        });
    });
    activatedText.addEventListener('click', function () {
        if (localStorage.getItem(SHIELD_ACTIVE_KEY) === '1') deactivateAll();
    });
})();
</script>
